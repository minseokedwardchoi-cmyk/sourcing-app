name: "[스파이크] 월마트 VNC 실현가능성 테스트 (Part B0)"

# 월마트/샘스클럽 자동화(Part B)를 만들기 전에, 애초에 되는 아이디어인지부터 확인하는
# 1회성 테스트 워크플로다. GitHub Actions 러너 안에서 Xvfb(가상 화면) + headed Chromium +
# x11vnc + noVNC + cloudflared(무료 quick tunnel)로 화면을 임시로 공개해서, 사람이 실제
# 브라우저 화면을 보고 PerimeterX "Press & Hold" 캡차를 직접 눌러 통과시킬 수 있는지
# 확인한다.
#
# 핵심 리스크: PerimeterX가 GitHub Actions 러너의 IP 대역 자체를 데이터센터 IP로 인식해서
# 사람이 눌러도 아예 안 뚫어줄 수 있다 — 그럴 경우 Part B는 여기서 접는다.
#
# 검증용 1회성이라 cron 없음, workflow_dispatch로만 실행. 통과 확인되면 이 파일은 지우고
# crawl_walmart_samsclub.yml(Part B1, 백엔드 콜백+히스토리 연동 포함 정식 버전)로 대체한다.

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: '브라우저를 열어두고 대기할 시간(분)'
        required: false
        default: '10'

jobs:
  vnc-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 화면 공유 도구 설치 (Xvfb, x11vnc, noVNC, cloudflared)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify
          curl -fsSL --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Playwright + Chromium 설치
        working-directory: scripts/crawl-walmart-samsclub
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Xvfb 가상 화면 시작
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: x11vnc + noVNC(웹 뷰어) 시작
        run: |
          VNC_PASS=$(openssl rand -hex 8)
          echo "VNC_PASS=${VNC_PASS}" >> "$GITHUB_ENV"
          x11vnc -display :99 -forever -shared -passwd "${VNC_PASS}" -rfbport 5900 -bg -o /tmp/x11vnc.log
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: cloudflared quick tunnel 시작 + URL 대기
        run: |
          cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          echo "cloudflared 시작, 터널 URL 대기 중..."
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=${URL}" >> "$GITHUB_ENV"
              break
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "터널 URL을 못 찾았습니다 — cloudflared 로그:"
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: 접속 링크를 Job Summary에 출력
        run: |
          {
            echo "## 🖥️ VNC 접속 정보 (테스트 끝나면 자동 만료)"
            echo ""
            echo "아래 링크로 접속해서, 브라우저에 월마트 검색 결과가 뜨는지 / PerimeterX 캡차가"
            echo "뜬다면 직접 눌러서 통과되는지 확인해주세요."
            echo ""
            echo "**접속 링크 (비밀번호 자동입력):**"
            echo '```'
            echo "${TUNNEL_URL}/vnc.html?autoconnect=true&password=${VNC_PASS}"
            echo '```'
            echo ""
            echo "비밀번호만 따로: \`${VNC_PASS}\`"
            echo ""
            echo "이 세션은 워크플로가 끝나면(최대 ${{ github.event.inputs.idle_minutes || '10' }}분 대기 후) 자동으로 닫힙니다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TUNNEL_URL=${TUNNEL_URL}"

      - name: 월마트 검색 페이지 열고 대기 (사람이 VNC로 확인하는 동안)
        working-directory: scripts/crawl-walmart-samsclub
        env:
          SPIKE_IDLE_MINUTES: ${{ github.event.inputs.idle_minutes || '10' }}
        run: node vnc-spike.js
