name: 아마존/이온몰 순위 크롤링

# 83개 상품유형(scripts/crawl-product-sourcing/type-query-map.csv)별로 아마존/이온몰
# 베스트셀러 순위를 크롤링해서 백엔드 이력 테이블(product_sourcing_crawl_run /
# crawl_snapshot_item)에 새 회차로 쌓는다. 메인페이지가 참조하는 product_sourcing_item
# (수작업 검증 데이터 포함)은 이 워크플로가 전혀 건드리지 않는다 — 프론트 "크롤링 히스토리"
# 버튼에서만 조회 가능.
#
# 자체 cron 스케줄 없음 — 대시보드 "최신화" 버튼으로 월마트/샘스클럽(crawl_walmart_samsclub.yml,
# VNC로 사람이 캡차 처리) 워크플로가 먼저 실행되고, 그게 끝나면(성공/실패 무관 — 월마트/샘스클럽이
# 실패해도 아마존/이온몰은 독립적으로 갱신할 가치가 있어서) workflow_run 트리거로 이 워크플로가
# 자동으로 이어서 실행된다. workflow_dispatch로 단독 수동 실행도 계속 가능(입력값은 이 경우에만
# 쓰이고, workflow_run으로 트리거될 땐 github.event.inputs가 없어 아래 기본값 all/40/빈 값으로
# 동작함).
#
# r.jina.ai 리더 프록시 방식이라 Playwright/브라우저가 필요 없어 GitHub Actions에서도
# 동작할 것으로 예상되지만, 실제 러너에서 r.jina.ai 아웃바운드가 되는지는 아직 실측 전이다
# — 처음엔 반드시 workflow_dispatch로 소량(limit=5, only=올리브유) 먼저 확인할 것.

on:
  workflow_dispatch:
    inputs:
      site:
        description: '대상 사이트 (all/amazon/aeon)'
        required: false
        default: 'all'
      limit:
        description: '유형당 상위 N개'
        required: false
        default: '40'
      only:
        description: '품목유형/대분류에 포함된 텍스트로 필터 (소량 테스트용, 비워두면 전체 83개)'
        required: false
        default: ''
  workflow_run:
    workflows: ["월마트/샘스클럽 크롤링"]
    types: [completed]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 크롤링 (results.jsonl에 누적)
        working-directory: scripts/crawl-product-sourcing
        run: |
          SITE="${{ github.event.inputs.site || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '40' }}"
          ONLY="${{ github.event.inputs.only || '' }}"
          ARGS="--site=${SITE} --limit=${LIMIT} --results=results.jsonl"
          if [ -n "$ONLY" ]; then
            ARGS="${ARGS} --only=${ONLY}"
          fi
          echo "실행: node crawl.js ${ARGS}"
          node crawl.js ${ARGS}

      - name: 실패 시 디버그 마크다운 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-debug-output
          path: scripts/crawl-product-sourcing/output/
          if-no-files-found: ignore
          retention-days: 14

      - name: 결과 업로드 (results.jsonl → 백엔드 이력 테이블)
        working-directory: scripts/crawl-product-sourcing
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          BACKEND_URL="${BACKEND_URL:-https://sourcing-backend-ucp5.onrender.com}" node upload.js --results=results.jsonl
