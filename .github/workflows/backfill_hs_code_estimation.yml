name: HS코드 캐시 백필 (hs_final_7397.csv, 1회성)

# backend/backfill_hs_code_estimation.py를 GitHub Actions에서 수동 실행하기 위한 워크플로.
# 이 저장소가 있는 세션(에이전트 샌드박스)은 네트워크 정책상 Postgres/백엔드에 직접 붙을 수
# 없어서, 실제 실행은 이 워크플로(정상적인 인터넷 접근이 되는 러너)를 통해서 한다.
#
# hs_code_estimation 캐시에 hs_final_7397.csv(7,397건 전수 스캔 판정 결과, 사이트 DB에
# 이미 동기화 완료된 값)를 시딩한다 — hs_code_estimate_gemini.py가 크롤링 이력의 새 상품
# 중 이름이 겹치는 걸 재조사하지 않고 즉시 재사용하게 하기 위한 선행 작업. hs_code_estimation
# 테이블/엔드포인트(/api/hs-code-estimation/*)가 배포된 백엔드에만 존재하므로, 이 워크플로는
# 그 배포가 끝난 뒤에 실행해야 한다.
#
# 1회 실행 후에는 굳이 다시 돌릴 필요 없음 — 이미 캐시된 name_key는 스킵되니 재실행해도
# 안전하지만(idempotent), 정기적으로 돌 필요는 없어 workflow_run 트리거는 없다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 실행에서 upsert할 상품 수 상한 (비우면 전체)'
        required: false
        default: ''
      dry_run:
        description: '대상 건수만 확인하고 실제 upsert는 하지 않음'
        required: false
        default: 'false'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install httpx

      - name: 백필 실행
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="${ARGS} --limit=${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          cd backend
          python backfill_hs_code_estimation.py ${ARGS}
