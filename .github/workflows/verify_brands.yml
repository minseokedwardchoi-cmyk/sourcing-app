name: 브랜드 검증 (Gemini)

# 크롤링 체인의 세 번째이자 마지막 단계: crawl_walmart_samsclub.yml → crawl_amazon_aeon.yml
# → verify_origin.yml(원산지판독) → hs_code_estimation.yml(HS코드 추정) → 이 워크플로
# (2026-08 개편 — 예전엔 세 검증/추정 워크플로가 크롤링 완료 시점에 전부 병렬로 떴었는데,
# 브랜드검증만 그라운딩이 브랜드별로 따로 필요해서 배치 처리가 안 되고, 그래서 무료 티어
# 하루 한도(250 RPD, 브랜드 1개당 리서치+구조화출력 2콜이라 실질 하루 최대 ~125개)에
# 걸리면 며칠씩 걸릴 수 있다. 배치 가능한 원산지판독/HS코드 추정을 먼저 끝내 "몇 시간
# 내로 HS코드·원산지·착지원가까지는 다 채워진 상태"를 만들고, 오래 걸릴 수 있는 이
# 워크플로만 맨 뒤에서 계속 돌게 분리했다).
#
# 크롤링 이력(product_sourcing_crawl_snapshot_item)에 새로 나타난 브랜드를 Gemini
# API(google_search 그라운딩)로 리콜/품질·표시/법적·평판 조사해서 백엔드의
# brand_verification 캐시에 upsert한다 (backend/verify_brands_gemini.py 참고). 원산지
# 판독/HS코드 추정과 달리 그라운딩(실시간 웹검색)이 꼭 필요한 작업이라 flash-lite로
# 낮추지 않고 gemini-2.5-flash를 그대로 쓴다 — 리콜/소송 정보는 최신 검색 품질이
# 중요해서 배치도, 모델 다운그레이드도 안 한다.
#
# ⚠️ 월마트/샘스클럽과 아마존/이온몰은 같은 업로드 엔드포인트를 쓰지만 서로 다른 회차
# (run_id)로 각각 올라간다. "최신 회차만" 보면 체인에서 먼저 끝난 월마트/샘스클럽
# 회차를 놓칠 수 있어서, workflow_run으로 자동 트리거됐을 때는 항상 --all-runs로
# 돌린다(이미 캐시된 브랜드는 스킵되니 매번 전체를 다시 훑어도 비용 문제 없음).
# workflow_dispatch(수동 실행)일 때만 all_runs 입력값을 따른다.
#
# product_sourcing_item(메인페이지, 수작업 검증 데이터 포함)은 이 워크플로가 전혀
# 건드리지 않는다 — 브랜드 단위 캐시만 채운다. 다른 크롤링 워크플로와 동일하게
# DATABASE_URL로 Postgres에 직접 붙지 않고 백엔드 HTTP API만 호출한다.
#
# limit×max_batches를 하루 무료 한도(250 RPD, 브랜드 1개당 리서치+구조화출력 2콜 소모)
# 안에 맞춘다: 20×6=120개 브랜드 → 240콜, 250 밑으로 여유를 둠. 한 회차에 신규 브랜드가
# 이보다 많으면(특히 --all-runs 소급 실행) 이번 실행에서 다 못 끝내고 캐시 안 된 채로
# 남는데, 다음 크롤링 체인이 돌 때(또는 수동 workflow_dispatch) 이어서 처리된다 — 이게
# "브랜드검증만 며칠 걸릴 수 있다"는 뜻이다.

on:
  workflow_run:
    workflows: ["HS코드 추정 (임베딩 후보검색 + Gemini)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '특정 크롤링 회차 ID (비우면 최신 회차)'
        required: false
        default: ''
      all_runs:
        description: '모든 회차를 통틀어 대상 브랜드 추출 (최초 1회 소급용)'
        required: false
        default: 'false'
      limit:
        description: '배치 1회당 검증할 브랜드 수'
        required: false
        default: '20'
      max_batches:
        description: '최대 배치 반복 횟수 (하루 무료 한도 250 RPD ÷ 브랜드당 2콜 기준으로 기본값 산정)'
        required: false
        default: '6'
      dry_run:
        description: '대상 브랜드만 출력하고 실제 검증은 하지 않음'
        required: false
        default: 'false'

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r backend/requirements-brand-verify.txt

      - name: 브랜드 검증 (대상이 없어질 때까지 배치 반복)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          MAX_BATCHES="${{ github.event.inputs.max_batches || '6' }}"
          RUN_ID="${{ github.event.inputs.run_id }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 크롤링 체인 자동 실행 — 월마트/샘스클럽 회차를 놓치지 않도록 항상 전체 회차 대상
            ALL_RUNS="true"
          else
            ALL_RUNS="${{ github.event.inputs.all_runs }}"
          fi

          ARGS="--limit=${LIMIT}"
          if [ -n "$RUN_ID" ]; then
            ARGS="${ARGS} --run-id=${RUN_ID}"
          fi
          if [ "$ALL_RUNS" = "true" ]; then
            ARGS="${ARGS} --all-runs"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi

          FAILURES=0
          for i in $(seq 1 "$MAX_BATCHES"); do
            echo "=== 배치 $i / $MAX_BATCHES (${ARGS}) ==="
            set +e
            out=$(python backend/verify_brands_gemini.py ${ARGS})
            status=$?
            set -e
            echo "$out"

            if [ "$status" -ne 0 ]; then
              FAILURES=$((FAILURES + 1))
              echo "배치 $i 실패 (누적 실패 ${FAILURES}회) — 다음 배치로 계속 진행"
              if [ "$FAILURES" -ge 3 ]; then
                echo "연속/누적 실패가 너무 많음 — 중단"
                exit 1
              fi
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run 모드 — 1회만 실행하고 종료"
              break
            fi

            if echo "$out" | grep -q "미검증 0개"; then
              echo "남은 미검증 브랜드 없음 — 종료"
              break
            fi
          done
